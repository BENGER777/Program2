<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Установка ВКонтакте</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f5f5;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 400px;
        }
        h1 { font-size: 22px; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; margin-bottom: 24px; }
        .install-btn {
            display: inline-block;
            background: #007aff;
            color: #fff;
            padding: 16px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .install-btn:active { background: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ВКонтакте</h1>
        <p>Нажмите кнопку ниже, чтобы установить приложение на iPhone</p>
        <a class="install-btn"
           href="itms-services://?action=download-manifest&url=https://твой-домен.ru/vk.plist">
            Установить
        </a>
    </div>
</body>
</html>
